
networks:
  mpi-network:
    driver: bridge

services:
  master:
    build: .
    hostname: master
    environment:
      - MPI_ROLE=master
      - MPI_PROCESSES=4
      - MPI_PROFILE=cpu-naive
    volumes:
      - ./results:/app/results
    networks:
      - mpi-network
    mem_limit: 256m
    depends_on:
      - node1
      - node2
      - node3

  node1:
    build: .
    hostname: node1
    environment:
      - MPI_ROLE=worker
      - MPI_PROFILE=cpu-naive
    networks:
      - mpi-network
    mem_limit: 256m

  node2:
    build: .
    hostname: node2
    environment:
      - MPI_ROLE=worker
      - MPI_PROFILE=cpu-naive
    networks:
      - mpi-network
    mem_limit: 256m

  node3:
    build: .
    hostname: node3
    environment:
      - MPI_ROLE=worker
      - MPI_PROFILE=cpu-naive
    networks:
      - mpi-network
    mem_limit: 256m